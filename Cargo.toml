[package]
name = "lazyproject"
version = "0.1.0"
edition = "2024"
description = "A fast, read-only TUI for inspecting git status, remote sync, and toolchains across all projects in a directory"
license = "MIT"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.15"
