[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "Transitive compile-time proc-macro via ratatui 0.29; unmaintained only, no security impact" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
